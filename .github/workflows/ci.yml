name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link & HTML check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links and image references
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline    only check local targets (external sites rate-limit and cause flaky failures)
          # --root-dir   REQUIRED: without it lychee errors on every root-relative link
          #              ("Cannot resolve root-relative link '/css/style.css': provide a root dir")
          args: >-
            --no-progress
            --offline
            --root-dir .
            './**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli

      # Assertions & collection settings live in .lighthouserc.json
      # NOTE: an assertion level without options defaults to minScore 1 (perfect score),
      # so every threshold below is set explicitly.
      - name: Run Lighthouse CI
        run: lhci autorun