name: Deploy to GitHub Pages

# Astro build -> Pages artifact -> production. This workflow replaces the
# previous "deploy from branch" setup. IMPORTANT: in the repository settings,
# under Settings -> Pages -> "Build and deployment", change the source to
# "GitHub Actions" or pushes to main will keep deploying the raw branch.
#
# Custom domain: configured in Settings -> Pages (martinmzumara.com).
# With an Actions publishing source GitHub does not need a CNAME file, but
# public/CNAME ships in the artifact as a harmless reminder of the domain.
# Enforce HTTPS becomes available up to 24h after the domain is attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + post-build checks)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
